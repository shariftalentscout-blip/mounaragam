<!DOCTYPE html>
<html lang="te">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mouna Ragam - Quotes & Stories</title>
<style>
  body { font-family: Arial, sans-serif; margin:0; background:#f5f5f5; }
  header { background:#6a1b9a; color:white; padding:15px; text-align:center; position:sticky; top:0; }
 .container { max-width:800px; margin:20px auto; padding:10px; }
 .card { background:white; padding:15px; margin:15px 0; border-radius:10px; box-shadow:0 2px 5px rgba(0,0,0,0.1); }
 .card img { width:100%; border-radius:8px; }
 .admin { background:#fff3cd; padding:15px; margin:20px 0; border-radius:10px; }
  input, textarea, select, button { width:100%; padding:10px; margin:8px 0; border:1px solid #ccc; border-radius:5px; }
  button { background:#6a1b9a; color:white; border:none; cursor:pointer; font-weight:bold; }
  button:hover { background:#4a148c; }
 .ads-section { background:#e3f2fd; padding:15px; margin:20px 0; border-radius:10px; }
 .ad-card { background:white; padding:10px; margin:10px 0; border-left:4px solid #2196f3; }
 .ad-card a { color:#2196f3; text-decoration:none; font-weight:bold; }
</style>
</head>
<body>

<header>
  <h1>🌸 Mouna Ragam 🌸</h1>
  <button onclick="showAdmin()">Admin Panel</button>
</header>

<div class="container" id="mainContent">
  <h2>Latest Quotes & Stories</h2>
  <div id="contentList"></div>

  <div class="ads-section">
    <h3>📢 Sponsored Ads</h3>
    <div id="adsList"></div>
  </div>
</div>

<!-- ADMIN PANEL -->
<div class="container admin" id="adminPanel" style="display:none;">
  <h2>Admin Panel - Add Content</h2>
  
  <label>Type Select Cheyyi:</label>
  <select id="typeSelect">
    <option value="quotes">Quote</option>
    <option value="stories">Story</option>
    <option value="ads">Ad</option>
  </select>

  <label>Category:</label>
  <select id="catSelect">
    <option value="love">Love</option>
    <option value="motivation">Motivation</option>
    <option value="sad">Sad</option>
  </select>

  <label>Image Link paste cheyyi:</label>
  <input id="imgLink" placeholder="https://example.com/image.jpg">

  <!-- Quote/Story kosam -->
  <textarea id="contentText" placeholder="Content ikkada rayi"></textarea>

  <!-- Ad kosam 3 boxes -->
  <input id="adTitle" placeholder="Ad Title rayi" style="display:none;">
  <textarea id="adText" placeholder="Ad Description rayi" style="display:none;"></textarea>
  <input id="adLink" placeholder="Ad Link URL paste cheyyi" style="display:none;">

  <button onclick="saveContent()">Add & Publish</button>
  <button onclick="hideAdmin()" style="background:#777;">Close</button>
</div>

<script>
let data = JSON.parse(localStorage.getItem('data') || '{}');

// Page load ayyagane content chupinchadam
window.onload = function(){
  loadContent();
  loadAds();
}

function showAdmin(){
  document.getElementById('adminPanel').style.display = 'block';
  document.getElementById('mainContent').style.display = 'none';
}

function hideAdmin(){
  document.getElementById('adminPanel').style.display = 'none';
  document.getElementById('mainContent').style.display = 'block';
}

// Dropdown marite fields change cheyyadaniki
document.getElementById('typeSelect').addEventListener('change', function(){
  let type = this.value;
  document.getElementById('contentText').style.display = (type=='ads')? 'none' : 'block';
  document.getElementById('catSelect').style.display = (type=='ads')? 'none' : 'block';
  document.getElementById('adTitle').style.display = (type=='ads')? 'block' : 'none';
  document.getElementById('adText').style.display = (type=='ads')? 'block' : 'none';
  document.getElementById('adLink').style.display = (type=='ads')? 'block' : 'none';
});

function saveContent(){
  let type = document.getElementById('typeSelect').value;
  let cat = document.getElementById('catSelect').value;
  let img = document.getElementById('imgLink').value || "https://picsum.photos/400/250";
  let data = JSON.parse(localStorage.getItem('data')||'{}');

  if(type == 'ads'){
    let adTitle = document.getElementById('adTitle').value;
    let adText = document.getElementById('adText').value;
    let adLink = document.getElementById('adLink').value;
    
    if(adTitle == "" || adText == ""){ 
      alert("Ad Title and Description raayandi anna"); 
      return; 
    }
    
    if(!data.ads) data.ads = [];
    data.ads.push({title: adTitle, text: adText, link: adLink, img: img});
    localStorage.setItem('data', JSON.stringify(data));
    
    document.getElementById('adTitle').value = '';
    document.getElementById('adText').value = '';
    document.getElementById('adLink').value = '';
    document.getElementById('imgLink').value = '';
    alert("Ad add ayyindi! Close kottu ippudu site lo chudu");
    loadAds();
    
  } else {
    let text = document.getElementById('contentText').value;
    if(text == ""){ 
      alert("Content raayandi anna"); 
      return; 
    }
    
    if(!data[type]) data[type] = {};
    if(!data[type][cat]) data[type][cat] = [];
    data[type][cat].push({img: img, text: text});
    localStorage.setItem('data', JSON.stringify(data));
    
    document.getElementById('contentText').value = '';
    document.getElementById('imgLink').value = '';
    alert("Content add ayyindi! Close kottu ippudu site lo chudu");
    loadContent();
  }
}

function loadContent(){
  let data = JSON.parse(localStorage.getItem('data') || '{}');
  let html = '';
  
  for(let type in data){
    if(type == 'ads') continue;
    for(let cat in data[type]){
      data[type][cat].forEach(item => {
        html += `<div class="card">
          <img src="${item.img}">
          <p><b>${cat.toUpperCase()}</b> - ${type}</p>
          <p>${item.text}</p>
        </div>`;
      });
    }
  }
  document.getElementById('contentList').innerHTML = html || '<p>Inka content ledu</p>';
}

function loadAds(){
  let data = JSON.parse(localStorage.getItem('data') || '{}');
  let html = '';
  
  if(data.ads){
    data.ads.forEach(ad => {
      html += `<div class="ad-card">
        <img src="${ad.img}" style="width:100%; max-height:200px; object-fit:cover;">
        <h4>${ad.title}</h4>
        <p>${ad.text}</p>
        ${ad.link? `<a href="${ad.link}" target="_blank">Click Here →</a>` : ''}
      </div>`;
    });
  }
  document.getElementById('adsList').innerHTML = html || '<p>Inka ads levu</p>';
}
</script>

</body>
</html>
